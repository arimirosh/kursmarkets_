{% extends "base.html" %}
{% block content %}
  <section class="result-header">
    <div>
      <p class="eyebrow">Request failed</p>
      <h1 class="result-title">Unable to load market data.</h1>
      <p class="lead">The data source returned an error. Check the ticker, interval, or selected date range.</p>
    </div>
    <a class="back-link" href="/">Back to scanner</a>
  </section>

  <div class="card error-box">
    <pre>{{ message }}</pre>
  </div>
{% endblock %}
