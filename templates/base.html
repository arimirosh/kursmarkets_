<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "CSPO Market Analytics" }}</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --text: #172033;
      --muted: #697386;
      --line: #dce3ec;
      --accent: #1565c0;
      --accent-dark: #0d47a1;
      --positive: #16845b;
      --negative: #b42318;
      --warning: #b7791f;
      --shadow: 0 18px 45px rgba(24, 39, 75, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: linear-gradient(180deg, #edf3fa 0%, var(--bg) 320px);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a { color: inherit; }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 44px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 8px;
      color: #ffffff;
      background: #102a43;
      box-shadow: 0 10px 22px rgba(16, 42, 67, 0.18);
    }

    .top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-pill,
    .nav-link {
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.78);
      font-size: 14px;
      font-weight: 650;
    }

    .nav-link {
      color: var(--accent-dark);
      font-weight: 800;
      text-decoration: none;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.9fr);
      gap: 24px;
      align-items: stretch;
      margin-bottom: 24px;
    }

    .hero-copy {
      padding: 28px 0;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font-size: clamp(40px, 6vw, 72px);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .lead {
      max-width: 620px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.6;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: var(--shadow);
    }

    .form-card {
      padding: 22px;
    }

    .section {
      margin-top: 24px;
    }

    .section-title {
      margin: 0 0 14px;
      font-size: 22px;
      line-height: 1.2;
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr 130px 150px;
      gap: 14px;
      align-items: end;
    }

    .forecast-grid {
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      gap: 14px;
      align-items: start;
    }

    .forecast-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 14px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #344054;
      font-size: 13px;
      font-weight: 750;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #cfd8e3;
      border-radius: 8px;
      color: var(--text);
      background: #ffffff;
      font: inherit;
      font-weight: 650;
      outline: none;
    }

    input,
    select {
      height: 44px;
      padding: 0 12px;
    }

    textarea {
      min-height: 96px;
      padding: 12px;
      resize: vertical;
      line-height: 1.45;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(21, 101, 192, 0.14);
    }

    .primary-button {
      width: 100%;
      height: 46px;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      background: var(--accent);
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      transition: transform 160ms ease, background 160ms ease;
    }

    .primary-button:hover {
      background: var(--accent-dark);
      transform: translateY(-1px);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .chip {
      border: 1px solid #cfd8e3;
      border-radius: 999px;
      padding: 7px 11px;
      color: #344054;
      background: var(--panel-soft);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 750;
    }

    .chip:hover {
      border-color: var(--accent);
      color: var(--accent-dark);
      background: #eef6ff;
    }

    .info-grid,
    .metrics-grid,
    .method-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .info-card,
    .metric-card,
    .method-card {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .metric-label,
    .info-label,
    .method-label {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .metric-value,
    .info-value,
    .method-value {
      margin: 0;
      font-size: 24px;
      font-weight: 850;
      line-height: 1.15;
    }

    .method-value {
      font-size: 18px;
    }

    .metric-note {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .positive { color: var(--positive); }
    .negative { color: var(--negative); }
    .warning { color: var(--warning); }

    .result-header {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: end;
      margin-bottom: 22px;
    }

    .result-title {
      margin: 0;
      font-size: clamp(34px, 5vw, 58px);
      line-height: 1;
    }

    .muted {
      color: var(--muted);
    }

    .chart-card {
      padding: 18px;
      overflow: hidden;
    }

    img {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .table-card {
      padding: 18px;
      overflow-x: auto;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      white-space: nowrap;
      font-size: 14px;
    }

    .table th,
    .table td {
      padding: 10px 12px;
      border-bottom: 1px solid #edf1f6;
      text-align: right;
    }

    .table th:first-child,
    .table td:first-child {
      text-align: left;
    }

    .table thead th {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .contribution-list {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .contribution-row {
      display: grid;
      grid-template-columns: 90px repeat(3, 1fr);
      gap: 10px;
      align-items: center;
      padding: 11px 12px;
      border: 1px solid #edf1f6;
      border-radius: 8px;
      background: #ffffff;
      font-size: 14px;
    }

    .contribution-row strong {
      color: var(--text);
    }

    .back-link {
      display: inline-flex;
      margin-top: 18px;
      color: var(--accent-dark);
      font-weight: 800;
      text-decoration: none;
    }

    .error-box {
      padding: 18px;
      border-left: 4px solid var(--negative);
    }

    pre {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    @media (max-width: 860px) {
      .hero,
      .forecast-grid,
      .forecast-options,
      .field-grid,
      .result-header {
        grid-template-columns: 1fr;
        display: grid;
      }

      .info-grid,
      .metrics-grid,
      .method-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .shell { width: min(100% - 22px, 1180px); padding-top: 18px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .info-grid,
      .metrics-grid,
      .method-grid { grid-template-columns: 1fr; }
      .contribution-row { grid-template-columns: 1fr; }
      .form-card,
      .chart-card,
      .table-card { padding: 14px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">CS</div>
        <div>
          <div>CSPO Market Analytics</div>
          <div class="muted" style="font-size: 13px; font-weight: 650;">MOEX price movement workspace</div>
        </div>
      </div>
      <div class="top-actions">
        <a class="nav-link" href="/">Market Dashboard</a>
        <a class="nav-link" href="/forecast">CSPO Forecast</a>
        <div class="nav-pill">Data source: {{ sdk or "MOEX ISS API" }}</div>
      </div>
    </header>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
